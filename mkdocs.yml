site_name: SDMX-DPM Interoperability
site_description: Documentation for SDMX-DPM Interoperability Work Package

# Documentation directory (relative to mkdocs.yml)
docs_dir: docs

# Theme configuration
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

# Plugins
plugins:
  - search


markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true


# Navigation structure
nav:
  - Home: index.md
  - Glossary & Abbreviations: models-relationships/glossary_and_abbreviations.md
  - Concept Note: concept-note.md
  - Business Case:
      - business-case/business-case-draft.md
  - Models Relationships:
      - models-relationships/index.md
      - Artefact Index: models-relationships/artefact_index.md
      - Basics:
          - models-relationships/00_basics/index.md
          - 1. Base Comparison: models-relationships/00_basics/01_base_comparison.md
          - 2. Detailed Mapping Rules: models-relationships/00_basics/02_detailed_mapping_rules.md
      - Glossary:
          - models-relationships/01_glossary/index.md
          - 1. Glossary Overview: models-relationships/01_glossary/01_glossary_overview.md
          - 2. High-Level Mapping Summary: models-relationships/01_glossary/02_high_level_mapping_summary.md
          - 3. Detailed Mapping Rules: models-relationships/01_glossary/03_detailed_mapping_rules.md
      - Data Definition:
          - models-relationships/02_data_definition/index.md
          - 1. Data Definition Overview: models-relationships/02_data_definition/01_data_definition_overview.md
          - 2. High-Level Mapping Summary: models-relationships/02_data_definition/02_high_level_mapping_summary.md
          - 3. Detailed Mapping Rules: models-relationships/02_data_definition/03_detailed_mapping_rules.md
      - Versioning and Extensibility:
          - models-relationships/04_versioning_and_extensibility/index.md
          - 1. Versioning Overview: models-relationships/04_versioning_and_extensibility/01_versioning_overview.md
          - 2. Extensibility Patterns: models-relationships/04_versioning_and_extensibility/02_extensibility_patterns.md
          - 3. Detailed Mapping Rules: models-relationships/04_versioning_and_extensibility/03_detailed_mapping_rules.md
      - Gaps:
          - models-relationships/05_gaps/index.md
          - 1. Gaps Overview: models-relationships/05_gaps/01_gaps_overview.md
          - 2. Specific Gap Analysis: models-relationships/05_gaps/02_specific_gap_analysis.md
  - Transformation Guidelines:
      - transformation-guidelines/index.md
