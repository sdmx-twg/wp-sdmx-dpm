[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-sdmx-dpm"
version = "0.1.0"
description = "Bidirectional conversion between DPM 2.0 Refit and SDMX 3.1 (pysdmx + dpmcore)"
requires-python = ">=3.10"
dependencies = [
    "pysdmx[all]>=1.16.0",
    "dpmcore>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dpm-to-sdmx = "wp_sdmx_dpm.cli:dpm_to_sdmx_main"
sdmx-to-dpm = "wp_sdmx_dpm.cli:sdmx_to_dpm_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
